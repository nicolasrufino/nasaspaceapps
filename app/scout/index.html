<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Vesta Scout</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f0a; color: #f3e6d8; font: 14px system-ui, sans-serif; }
      #scene { display: block; width: 100%; height: 100%; touch-action: none; }
      .panel { position: fixed; background: #000b; padding: 8px 10px; border-radius: 8px; }
      #hud { left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: grid; gap: 8px;
        width: min(320px, calc(100vw - 24px)); max-height: 52vh; overflow: auto; }
      [role=tablist] { display: flex; gap: 4px; }
      [role=tab] { flex: 1; }
      [role=tab][aria-selected=true] { background: #35e0ff; }
      #plan, #walk { display: grid; gap: 8px; }
      #terrainClassifier { display: grid; gap: 8px; }
      #terrainClassifier summary { cursor: pointer; font-weight: 600; }
      #terrainPhoto { max-width: 100%; }
      #terrainPreview { display: block; width: 100%; cursor: crosshair; }
      [hidden] { display: none !important; }
      #layers { display: grid; gap: 4px; }
      #layers label { display: flex; gap: 6px; align-items: start; }
      #layers small, #detail small, .src, figcaption { display: block; color: #cdbba8; font-size: 12px; }
      #layers details { margin-top: 2px; }
      #layers details summary { cursor: pointer; color: #cdbba8; }
      #legend { left: max(12px, env(safe-area-inset-left)); bottom: max(12px, env(safe-area-inset-bottom));
        width: min(300px, calc(100vw - min(38vmin, 260px) - 60px)); max-height: 40vh; overflow: auto; font-size: 11px; }
      #legend ul { list-style: none; margin: 4px 0; padding: 0; display: grid; gap: 3px; }
      #legend li { display: flex; gap: 6px; align-items: start; }
      #legend i { flex: none; width: 14px; height: 14px; border-radius: 3px; border: 1px solid #fff4; margin-top: 1px; }
      #targets { display: grid; gap: 4px; }
      .stop { display: flex; gap: 6px; align-items: center; }
      .stop .name { flex: 1; text-align: left; }
      .stop button[aria-pressed=true] { background: #ffd23f; }
      .warn { color: #ff8a6a; }
      .warn:empty { display: none; }
      #map { cursor: crosshair; }
      #whyTable { border-collapse: collapse; width: 100%; }
      #whyTable th, #whyTable td { text-align: left; padding: 1px 6px 1px 0; font-weight: normal; }
      #whyTable th { color: #f3e6d8; }
      #whyNotes { margin: 4px 0; padding-left: 1.1em; }
      #detail p { margin: 4px 0; }
      #detail figure { margin: 6px 0 0; }
      #detail img { width: 100%; border-radius: 4px; }
      #hud progress { width: 100%; accent-color: #35e0ff; }
      #stats { margin: 0; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
      .row { display: flex; gap: 6px; }
      button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 0; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 0; color: #cdbba8; }
      #minimap { right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); }
      #minimap canvas { display: block; width: min(38vmin, 260px); image-rendering: pixelated; border: 1px solid #fff4; }
      /* Point of no return: the screen turns red. */
      #alarm { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 6px #e02020, inset 0 0 80px #e0202088; display: none; }
      body.danger #alarm { display: block; }
      body.danger #hud { background: #8a0d0dd9; }
      /* Vesta Vision menu: the Mission VESTA look (Rethink Sans, solid dark panels, one accent). Styling only. */
      @font-face { font-family: "Rethink Sans"; src: url("../mission-vesta/assets/rethink-sans.woff2") format("woff2"); font-weight: 400 800; font-display: swap; }
      .panel { background: #141a22f2; border-radius: 14px; padding: 12px; box-shadow: 0 8px 28px #0007; font-family: "Rethink Sans", system-ui, sans-serif; }
      #hud { gap: 12px; width: min(336px, calc(100vw - 24px)); scrollbar-width: thin; scrollbar-color: #fff3 transparent; }
      #title { font-size: 13px; font-weight: 600; line-height: 1.35; color: #c9d3de; }
      #hud [role=tablist] { background: #ffffff12; border-radius: 10px; padding: 3px; gap: 3px; }
      #hud [role=tab] { background: transparent; color: #dfe7ee; font-weight: 600; border-radius: 8px; min-height: 36px; cursor: pointer; }
      #hud [role=tab][aria-selected=true] { background: #35e0ff; color: #08222b; }
      #hud h2 { font-size: 11px; letter-spacing: .12em; color: #8fa1b3; font-weight: 700; }
      #hud button:not([role=tab]) { background: #ffffff1a; color: #fff; font-weight: 600; min-height: 36px; border-radius: 9px; cursor: pointer; }
      #hud button:not([role=tab]):hover { background: #ffffff2b; }
      #hud #scout, #hud #play { background: #35e0ff; color: #08222b; }
      #hud button:disabled { opacity: .5; cursor: default; }
      #hud .stop button[aria-pressed=true] { background: #ffd23f; color: #201a00; }
      #layers small, #detail small, .src, figcaption { color: #9fb0c0; }
      #minimap { padding: 8px; }
      #minimap canvas { border: 0; border-radius: 8px; }
      @media (min-width: 601px) {
        #layers { gap: 2px; }
        #layers label { gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; cursor: pointer; border-left: 3px solid transparent; }
        #layers label:hover { background: #ffffff10; }
        #layers label:has(input[type=radio]:checked) { background: #35e0ff1f; border-left-color: #35e0ff; }
        #layers label input[type=radio] { position: absolute; opacity: 0; pointer-events: none; }
        #layers label b { font-weight: 600; }
        #layers label small { display: none; margin-top: 2px; line-height: 1.3; }
        #layers label:has(:checked) small, #layers label:hover small { display: block; } /* the source shows for the view in use */
        #layers input[type=checkbox] { accent-color: #35e0ff; width: 16px; height: 16px; flex: none; }
        #layers details summary { padding: 6px 10px; font-size: 12px; }
      }
      /* Phones (ticket F8): view picker as chips without the source lines (they stay in the legend and on wide screens), 44 px buttons. */
      @media (max-width: 600px) {
        #hud { max-height: 44vh; }
        #legend { max-height: 24vh; }
        #layers { display: flex; flex-wrap: wrap; gap: 6px; }
        #layers small { display: none; }
        #layers > label { align-items: center; background: #fff2; border-radius: 16px; padding: 6px 10px; }
        #layers > label:has(:checked) { background: #35e0ff; color: #111; }
        #layers > label input[type=radio] { position: absolute; opacity: 0; pointer-events: none; }
        #layers details { flex-basis: 100%; }
        button { min-height: 44px; }
      }
    </style>
    <!-- The guided mission mounts only after the world loads (initFlow at the end of src/main.js); until then the
         Vision panels would show for a moment. Same test as main.js's flowMode. -->
    <script>if (!/[?&](vision|world|flags)(=|&|$)/.test(location.search)) document.documentElement.classList.add('flow-boot')</script>
    <style>html.flow-boot body:not(.flow) > * { visibility: hidden; }</style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="alarm"></div>
    <div id="hud" class="panel">
      <strong id="title">Loading world…</strong>
      <div role="tablist">
        <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
        <button role="tab" data-tab="walk" aria-selected="false">Walk</button>
      </div>
      <section id="plan">
        <div id="scoutBox" hidden>
          <h2>Scout</h2>
          <div class="row">
            <button id="scout">Fly the route</button>
          </div>
          <p id="scoutStatus" class="src" aria-live="polite"></p>
        </div>
        <h2>Map layer</h2>
        <div id="layers" role="radiogroup" aria-label="Map layer"></div>
        <small id="sources" class="src"></small>
        <h2>Science stops</h2>
        <div id="route"></div>
        <div id="dropped" class="warn"></div>
        <div id="targets"></div>
        <small class="src">Tick the stops for this walk. Tap the minimap to add your own stop.</small>
        <div id="whyBox" hidden>
          <h2>Why this route</h2>
          <table id="whyTable" class="src"></table>
          <ul id="whyNotes" class="src"></ul>
        </div>
        <div id="detail" aria-live="polite"></div>
      </section>
      <section id="walk" hidden role="status" aria-live="polite">
        <progress id="energy" max="1" value="1" aria-label="Energy left"></progress>
        <pre id="stats"></pre>
        <div class="row">
          <button id="play">Walk</button>
          <button id="step">Step</button>
          <button id="reset">Reset</button>
        </div>
      </section>
    </div>
    <div id="legend" class="panel src" hidden></div>
    <div id="minimap" class="panel">
      <canvas id="map" aria-label="Minimap of the site, north up; shaded cells are outside the walk-back ring"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
