<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Martian Map</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f0a; color: #f3e6d8; font: 14px system-ui, sans-serif; }
      #scene { display: block; width: 100%; height: 100%; touch-action: none; }
      .panel { position: fixed; background: #000a; padding: 8px 10px; border-radius: 8px; }
      #hud { left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: grid; gap: 6px; max-width: min(320px, 60vw); }
      #hud progress { width: 100%; accent-color: #35e0ff; }
      #stats { margin: 0; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
      #controls { display: flex; gap: 6px; }
      button, select { font: inherit; padding: 6px 12px; border-radius: 6px; border: 0; }
      #minimap { right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); display: grid; gap: 6px; }
      #minimap canvas { width: min(38vmin, 260px); image-rendering: pixelated; border: 1px solid #fff4; }
      /* Point of no return: the screen turns red. */
      #alarm { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 6px #e02020, inset 0 0 80px #e0202088; display: none; }
      body.danger #alarm { display: block; }
      body.danger #hud { background: #8a0d0dd9; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="alarm"></div>
    <div id="hud" class="panel" role="status" aria-live="polite">
      <strong id="title">Loading world…</strong>
      <progress id="energy" max="1" value="1" aria-label="Energy left"></progress>
      <pre id="stats"></pre>
      <div id="controls">
        <button id="play">Walk</button>
        <button id="step">Step</button>
        <button id="reset">Reset</button>
      </div>
    </div>
    <div id="minimap" class="panel">
      <label>Minimap layer <select id="layer" aria-label="Minimap layer"></select></label>
      <canvas id="map" aria-label="Minimap of the site, north up; shaded cells are outside the walk-back ring"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
