<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Martian Map</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1a0f0a; color: #f3e6d8; font: 14px system-ui, sans-serif; }
      #scene { display: block; width: 100%; height: 100%; touch-action: none; }
      .panel { position: fixed; background: #000b; padding: 8px 10px; border-radius: 8px; }
      #hud { left: max(12px, env(safe-area-inset-left)); top: max(12px, env(safe-area-inset-top)); display: grid; gap: 8px;
        width: min(320px, calc(100vw - 24px)); max-height: 52vh; overflow: auto; }
      [role=tablist] { display: flex; gap: 4px; }
      [role=tab] { flex: 1; }
      [role=tab][aria-selected=true] { background: #35e0ff; }
      #plan, #walk { display: grid; gap: 8px; }
      [hidden] { display: none !important; }
      #layers { display: grid; gap: 4px; }
      #layers label { display: flex; gap: 6px; align-items: start; }
      #layers small, #detail small, .src, figcaption { display: block; color: #cdbba8; font-size: 12px; }
      #targets { display: grid; gap: 4px; }
      .stop { display: flex; gap: 6px; align-items: center; }
      .stop .name { flex: 1; text-align: left; }
      .stop button[aria-pressed=true] { background: #ffd23f; }
      .warn { color: #ff8a6a; }
      .warn:empty { display: none; }
      #map { cursor: crosshair; }
      #detail p { margin: 4px 0; }
      #detail figure { margin: 6px 0 0; }
      #detail img { width: 100%; border-radius: 4px; }
      #hud progress { width: 100%; accent-color: #35e0ff; }
      #stats { margin: 0; font: 13px/1.4 ui-monospace, monospace; white-space: pre-wrap; }
      .row { display: flex; gap: 6px; }
      button { font: inherit; padding: 6px 12px; border-radius: 6px; border: 0; }
      h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; margin: 0; color: #cdbba8; }
      #minimap { right: max(12px, env(safe-area-inset-right)); bottom: max(12px, env(safe-area-inset-bottom)); }
      #minimap canvas { display: block; width: min(38vmin, 260px); image-rendering: pixelated; border: 1px solid #fff4; }
      /* Point of no return: the screen turns red. */
      #alarm { position: fixed; inset: 0; pointer-events: none; box-shadow: inset 0 0 0 6px #e02020, inset 0 0 80px #e0202088; display: none; }
      body.danger #alarm { display: block; }
      body.danger #hud { background: #8a0d0dd9; }
    </style>
  </head>
  <body>
    <canvas id="scene"></canvas>
    <div id="alarm"></div>
    <div id="hud" class="panel">
      <strong id="title">Loading world…</strong>
      <div role="tablist">
        <button role="tab" data-tab="plan" aria-selected="true">Plan</button>
        <button role="tab" data-tab="walk" aria-selected="false">Walk</button>
      </div>
      <section id="plan">
        <h2>Map layer</h2>
        <div id="layers" role="radiogroup" aria-label="Map layer"></div>
        <small id="sources" class="src"></small>
        <h2>Science stops</h2>
        <div id="route"></div>
        <div id="dropped" class="warn"></div>
        <div id="targets"></div>
        <small class="src">Tick the stops for this walk. Tap the minimap to add your own stop.</small>
        <div id="detail" aria-live="polite"></div>
      </section>
      <section id="walk" hidden role="status" aria-live="polite">
        <progress id="energy" max="1" value="1" aria-label="Energy left"></progress>
        <pre id="stats"></pre>
        <div class="row">
          <button id="play">Walk</button>
          <button id="step">Step</button>
          <button id="reset">Reset</button>
        </div>
      </section>
    </div>
    <div id="minimap" class="panel">
      <canvas id="map" aria-label="Minimap of the site, north up; shaded cells are outside the walk-back ring"></canvas>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
