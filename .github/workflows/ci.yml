name: CI
on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# New push to the same PR cancels the old run, so fast pushers don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job name "ci" is the required status check. Rename it = update the ruleset too.
  # ponytail: no path filters on purpose, a skipped required check blocks merging forever.
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Hygiene (~5 s), before anything writes node_modules/: no secrets, no big files or data in the wrong place.
      # gitleaks binary pinned by version + sha256 (no action, no license needed). False positive: add its fingerprint to .gitleaksignore.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
      - name: Big files, weights, datasets, .env
        run: bash scripts/check-hygiene.sh

      # Node: runs whatever scripts exist in package.json (lint, typecheck, test, build).
      # ponytail: root-level only; if you split into frontend/ backend/, add working-directory.
      - if: hashFiles('package-lock.json') != ''
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - if: hashFiles('package-lock.json') != ''
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

      # Python: ruff + pytest. Exit code 5 = "no tests collected", which is fine early on.
      - if: hashFiles('requirements.txt') != ''
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - if: hashFiles('requirements.txt') != ''
        run: |
          pip install -r requirements.txt ruff pytest
          ruff check .
          pytest || [ $? -eq 5 ]
