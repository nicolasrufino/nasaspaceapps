name: CI
on:
  pull_request:
  push:
    branches: [main, dev]
  merge_group:

# New push to the same PR cancels the old run, so fast pushers don't queue up.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One job per lane, run in parallel; the "ci" job at the bottom is the only required check.
# ponytail: no path filters on purpose, a skipped required check blocks merging forever,
#           and every lane finishes in under a minute anyway.
jobs:
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # gitleaks binary pinned by version + sha256. False positive: add its fingerprint to .gitleaksignore.
      - name: Secret scan (gitleaks)
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gl.tgz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gl.tgz" | sha256sum -c --quiet
          tar -xzf "$RUNNER_TEMP/gl.tgz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" dir . --redact --no-banner
      - name: Big files, weights, datasets, .env
        run: bash scripts/check-hygiene.sh
      - run: pipx run ruff check .

  # P2: three.js app. npm run build also runs app/scripts/check-dist.mjs (worlds in dist, JS budget, headless boot).
  app:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - working-directory: app
        run: |
          npm ci
          npm run lint --if-present
          npm run typecheck --if-present
          npm test --if-present
          npm run build --if-present

  # Browser tests on a software renderer are CPU-bound: one runner and one worker per shard, all 9 tests still run.
  app-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - id: pw
        working-directory: app
        run: |
          npm ci
          echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        working-directory: app
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        working-directory: app
        run: npx playwright install-deps chromium
      - working-directory: app
        run: |
          npm run build
          npx playwright test --shard=${{ matrix.shard }}/4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: app/test-results/
          retention-days: 7

  # P3: world files are the contract every lane reads. Pipeline must run, every world must validate.
  data:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python data/pipeline/make_world.py
      - run: pytest -q tests/test_make_world.py tests/test_worlds.py

  # P1: ONNX exports match CONTRACTS §2; agent imports with no Azure keys or network. Also runs every other test.
  ml-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # R5 reuses the app's JS planner/scout/energy functions rather than a second implementation.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            ml/requirements-ci.txt
      - run: pip install -r requirements.txt -r ml/requirements-ci.txt pytest
      - run: if [ -f agent/requirements.txt ]; then pip install -r agent/requirements.txt; fi
      - run: python ml/check_exports.py
      # Exit code 5 = "no tests collected", fine early on.
      - run: pytest -q || [ $? -eq 5 ]

  # Required status check. Rename it = update the ruleset too.
  ci:
    if: always()
    needs: [hygiene, app, app-browser, data, ml-agent]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
