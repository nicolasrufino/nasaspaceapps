# CD: the phone app on Azure Static Web Apps (HTTPS, so phone sensors work). Block D5 (#14), F3 (#47).
# Deploys only when someone asks (we ship fast; not every push needs a deploy):
#   production -> Actions > Deploy > Run workflow on main   (or: gh workflow run deploy.yml)
#                 serves https://nasa.nicolasrufino.com
#   preview    -> add the `deploy` label to a PR; the SWA bot comments the preview URL.
#                 New commits don't redeploy: remove and re-add the label.
#   PR closed  -> its preview is deleted (Free plan: max 3 previews at once).
# It no-ops (green, with a notice) until the secret AZURE_STATIC_WEB_APPS_API_TOKEN exists and app/package.json is on the branch.
# Fork PRs get no secrets, so they no-op too (never pull_request_target: it would run fork code with our token).
name: Deploy
on:
  pull_request:
    types: [labeled, closed]
  workflow_dispatch:

# One deploy per PR (or main) at a time; a newer push replaces an older one.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write # the SWA action comments the preview URL on the PR

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'deploy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - id: gate
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Deploy skipped: secret AZURE_STATIC_WEB_APPS_API_TOKEN is not set (or this is a fork PR)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo "::notice::Deploy skipped: run it on main for production; for a preview, label the PR 'deploy'."
            echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ ! -f app/package.json ]; then
            echo "::notice::Deploy skipped: app/package.json does not exist on this branch yet."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.gate.outputs.go == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # We build here (not Oryx) so Node matches CI and vite can reach ../data/worlds (its publicDir).
      - if: steps.gate.outputs.go == 'true'
        working-directory: app
        run: |
          npm ci
          npm run build
          if [ -f staticwebapp.config.json ]; then cp staticwebapp.config.json dist/; fi
          du -sh dist

      - if: steps.gate.outputs.go == 'true'
        id: swa
        uses: Azure/static-web-apps-deploy@v1
        # ponytail: Free plan allows 3 preview environments; a 4th open PR fails here. Don't let that turn the PR red.
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: app/dist
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main

      - if: steps.swa.outputs.static_web_app_url != ''
        run: echo "::notice::Deployed to ${{ steps.swa.outputs.static_web_app_url }}"

  close-preview:
    if: github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'deploy')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - id: gate
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::Nothing to close: secret AZURE_STATIC_WEB_APPS_API_TOKEN is not set (or this is a fork PR)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.go == 'true'
        uses: Azure/static-web-apps-deploy@v1
        continue-on-error: true # no preview existed (e.g. app/ was missing) -> nothing to close
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
          app_location: app/dist
